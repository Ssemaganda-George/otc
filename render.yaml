services:
  # Frontend React Application (Web Service for SPA routing)
  - type: web
    name: otc-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false